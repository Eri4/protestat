# Publishes the optional group server as a Docker image: ghcr.io/<owner>/protestat-relay
name: Relay image

on:
  push:
    branches: [main]
    paths: ['server/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/protestat-relay" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ${{ steps.name.outputs.image }}:latest
