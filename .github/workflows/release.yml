# Builds the Android APK and attaches it to a GitHub Release.
# Trigger: push a tag like v0.1.0   (git tag v0.1.0 && git push origin v0.1.0)
# Free for public repositories.
name: Release APK

on:
  push:
    tags: ['v*', '[0-9]*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npx cap sync android

      # Release signing. Add these repository secrets once (see README → "Signing key"):
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # Without them the APK is signed with a throwaway debug key (installable, but users
      # would have to uninstall before updating to a properly signed build).
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "1" ]; then ./gradlew assembleRelease; else ./gradlew assembleDebug; fi

      - name: Collect APK and checksum
        run: |
          mkdir out
          f=$(ls android/app/build/outputs/apk/*/*.apk | head -1)
          cp "$f" "out/Protestat-${GITHUB_REF_NAME}.apk"
          cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs *.apk | tee -a SIGNING-CERT.txt || true

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/*
          generate_release_notes: true

      - uses: actions/upload-artifact@v4
        with:
          name: protestat-apk
          path: out/*
